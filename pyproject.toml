[project]
name = "discord-compression-bot"
version = "0.1.0"
description = "A Discord bot for compressing images, videos, and GIFs with GPU (NVENC) acceleration and target-size precision."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.10.0",
    "discord.py>=2.4.0",
    "pillow>=10.4.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]
